name: Python combined grading canaries

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "activities/python/py2-activity-b-return-area-001/**"
      - "activities/python/py2-activity-b-serbatoio-invariante-001/**"
      - "activities/python/py2-activity-b-file-risultato-001/**"
      - "config/p2-canary-profile.json"
      - "config/p3-canary-profile.json"
      - "config/p4-canary-profile.json"
      - "tests/p2_m13_consumer.py"
      - "tests/p3_m28_consumer.py"
      - "tests/p4_m26_consumer.py"
      - "tests/python_grading_toolchain_alignment.py"
      - ".github/workflows/python-grading-canaries.yml"

jobs:
  combined-course-canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout python-docente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify P2 P3 P4 stable pins and fallback are aligned
        run: python tests/python_grading_toolchain_alignment.py

      - name: Resolve published release source fallback
        id: grading
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          paths = ["config/p2-canary-profile.json", "config/p3-canary-profile.json", "config/p4-canary-profile.json"]
          profiles = [json.loads(Path(path).read_text(encoding="utf-8")) for path in paths]
          assert len({p["thebitlab"]["ref"] for p in profiles}) == 1
          assert len({p["authoritative_grading"]["toolchain_version"] for p in profiles}) == 1
          assert len({p["authoritative_grading"]["local_image_tag"] for p in profiles}) == 1
          print("ref=" + profiles[0]["thebitlab"]["ref"])
          print("version=" + profiles[0]["authoritative_grading"]["toolchain_version"])
          print("image=" + profiles[0]["authoritative_grading"]["local_image_tag"])
          PY

      - name: Checkout exact published TheBitLab release source once
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TheBitPoets/2cornot2c
          ref: ${{ steps.grading.outputs.ref }}
          path: _thebitlab-grading
          persist-credentials: false

      - name: Verify stable release source and fallback boundary
        shell: bash
        run: |
          test "$(git -C _thebitlab-grading rev-parse HEAD)" = "${{ steps.grading.outputs.ref }}"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("_thebitlab-grading")
          assert 'PROFILE_ID = "python-function-v1"' in (root / "scripts/python_function_profile.py").read_text(encoding="utf-8")
          assert 'PROFILE_ID = "python-object-v1"' in (root / "scripts/python_object_profile.py").read_text(encoding="utf-8")
          assert 'PROFILE_ID = "python-filesystem-v1"' in (root / "scripts/python_filesystem_profile.py").read_text(encoding="utf-8")
          manifest = json.loads((root / "docker/assignment-runner/toolchain.json").read_text(encoding="utf-8"))
          assert manifest["version"] == "2026.08.3"
          profiles = [json.loads(Path(path).read_text(encoding="utf-8")) for path in ("config/p2-canary-profile.json", "config/p3-canary-profile.json", "config/p4-canary-profile.json")]
          for profile in profiles:
              grading = profile["authoritative_grading"]
              assert grading["strategy"] == "source-build-from-published-release-source"
              assert grading["release_identity_status"] == "published-immutable-stable"
              assert grading["consumer_image_access_status"] == "ghcr-cross-repository-actions-access-pending"
              assert profile["certification_policy"]["immutable_release_lock_verified"] is True
              assert profile["certification_policy"]["direct_immutable_image_pull_verified"] is False
          PY

      - name: Build the published release source once
        working-directory: _thebitlab-grading
        run: >-
          python scripts/build_assignment_runner.py
          --source-revision "${{ steps.grading.outputs.ref }}"
          --tag "${{ steps.grading.outputs.image }}"
          --metadata "$RUNNER_TEMP/python-docente-stable-source-runner.json"

      - name: Verify one rebuilt stable source identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "python-docente-stable-source-runner.json").read_text(encoding="utf-8"))
          assert metadata["version"] == "2026.08.3"
          assert metadata["source_revision"] == "23bc1d36c7eb8c1b10a11cbde5f226ce7554f85e"
          assert metadata["platform"] == "linux/amd64"
          PY

      - name: Run M13 P2 through the shared stable-source runner
        run: python tests/p2_m13_consumer.py --platform _thebitlab-grading --docker-image "${{ steps.grading.outputs.image }}"

      - name: Run M28 P3 through the same stable-source runner
        run: python tests/p3_m28_consumer.py --platform _thebitlab-grading --docker-image "${{ steps.grading.outputs.image }}"

      - name: Run M26 P4 through the same stable-source runner
        run: python tests/p4_m26_consumer.py --platform _thebitlab-grading --docker-image "${{ steps.grading.outputs.image }}"
