name: Python combined grading canaries

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "activities/python/py2-activity-b-return-area-001/**"
      - "activities/python/py2-activity-b-file-risultato-001/**"
      - "config/p2-canary-profile.json"
      - "config/p4-canary-profile.json"
      - "tests/p2_m13_consumer.py"
      - "tests/p4_m26_consumer.py"
      - "tests/python_grading_toolchain_alignment.py"
      - ".github/workflows/python-grading-canaries.yml"

jobs:
  combined-course-canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout python-docente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify P2 P4 course pins are aligned
        run: python tests/python_grading_toolchain_alignment.py

      - name: Resolve exact combined grading candidate
        id: grading
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p2 = json.loads(Path("config/p2-canary-profile.json").read_text(encoding="utf-8"))
          p4 = json.loads(Path("config/p4-canary-profile.json").read_text(encoding="utf-8"))
          assert p2["thebitlab"]["ref"] == p4["thebitlab"]["ref"]
          assert p2["authoritative_grading"]["toolchain_version"] == p4["authoritative_grading"]["toolchain_version"]
          assert p2["authoritative_grading"]["local_image_tag"] == p4["authoritative_grading"]["local_image_tag"]
          print("ref=" + p2["thebitlab"]["ref"])
          print("version=" + p2["authoritative_grading"]["toolchain_version"])
          print("image=" + p2["authoritative_grading"]["local_image_tag"])
          PY

      - name: Checkout exact combined TheBitLab candidate once
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TheBitPoets/2cornot2c
          ref: ${{ steps.grading.outputs.ref }}
          path: _thebitlab-grading
          persist-credentials: false

      - name: Verify combined candidate source and lock boundary
        shell: bash
        run: |
          test "$(git -C _thebitlab-grading rev-parse HEAD)" = "${{ steps.grading.outputs.ref }}"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("_thebitlab-grading")
          p2 = (root / "scripts" / "python_function_profile.py").read_text(encoding="utf-8")
          p4 = (root / "scripts" / "python_filesystem_profile.py").read_text(encoding="utf-8")
          manifest = json.loads((root / "docker" / "assignment-runner" / "toolchain.json").read_text(encoding="utf-8"))
          lock = json.loads((root / "docker" / "assignment-runner" / "toolchain.lock.json").read_text(encoding="utf-8"))
          assert 'PROFILE_ID = "python-function-v1"' in p2
          assert 'PROFILE_ID = "python-filesystem-v1"' in p4
          assert manifest["version"] == "2026.08.2"
          assert lock["version"] == "2026.07.1"
          PY

      - name: Build the combined assignment runner once
        working-directory: _thebitlab-grading
        run: >-
          python scripts/build_assignment_runner.py
          --source-revision "${{ steps.grading.outputs.ref }}"
          --tag "${{ steps.grading.outputs.image }}"
          --metadata "$RUNNER_TEMP/python-docente-combined-runner.json"

      - name: Verify one built toolchain identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p2 = json.loads(Path("config/p2-canary-profile.json").read_text(encoding="utf-8"))
          p4 = json.loads(Path("config/p4-canary-profile.json").read_text(encoding="utf-8"))
          metadata = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "python-docente-combined-runner.json").read_text(encoding="utf-8")
          )
          assert metadata["version"] == p2["authoritative_grading"]["toolchain_version"] == p4["authoritative_grading"]["toolchain_version"] == "2026.08.2"
          assert metadata["source_revision"] == p2["thebitlab"]["ref"] == p4["thebitlab"]["ref"]
          assert metadata["platform"] == p2["authoritative_grading"]["platform"] == p4["authoritative_grading"]["platform"] == "linux/amd64"
          PY

      - name: Run M13 P2 through the shared runner
        run: >-
          python tests/p2_m13_consumer.py
          --platform _thebitlab-grading
          --docker-image "${{ steps.grading.outputs.image }}"

      - name: Run M26 P4 through the same shared runner
        run: >-
          python tests/p4_m26_consumer.py
          --platform _thebitlab-grading
          --docker-image "${{ steps.grading.outputs.image }}"
