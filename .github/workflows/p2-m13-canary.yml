name: Python M13 P2 canary

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "activities/python/py2-activity-b-return-area-001/**"
      - "config/p2-canary-profile.json"
      - "tests/p2_m13_consumer.py"
      - ".github/workflows/p2-m13-canary.yml"

jobs:
  m13-p2-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout python-docente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Resolve exact combined P2 P3 P4 candidate identity
        id: p2
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          profile = json.loads(Path("config/p2-canary-profile.json").read_text(encoding="utf-8"))
          print("ref=" + profile["thebitlab"]["ref"])
          print("image=" + profile["authoritative_grading"]["local_image_tag"])
          print("version=" + profile["authoritative_grading"]["toolchain_version"])
          PY

      - name: Checkout exact combined TheBitLab candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TheBitPoets/2cornot2c
          ref: ${{ steps.p2.outputs.ref }}
          path: _thebitlab-p2
          persist-credentials: false

      - name: Verify combined P2 P3 P4 release-candidate identity
        shell: bash
        run: |
          test "$(git -C _thebitlab-p2 rev-parse HEAD)" = "${{ steps.p2.outputs.ref }}"
          python - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("config/p2-canary-profile.json").read_text(encoding="utf-8"))
          root = Path("_thebitlab-p2")
          p2 = (root / "scripts" / "python_function_profile.py").read_text(encoding="utf-8")
          p3 = (root / "scripts" / "python_object_profile.py").read_text(encoding="utf-8")
          p4 = (root / "scripts" / "python_filesystem_profile.py").read_text(encoding="utf-8")
          manifest = json.loads((root / "docker" / "assignment-runner" / "toolchain.json").read_text(encoding="utf-8"))
          lock = json.loads((root / "docker" / "assignment-runner" / "toolchain.lock.json").read_text(encoding="utf-8"))
          assert 'PROFILE_ID = "python-function-v1"' in p2
          assert 'PROFILE_ID = "python-object-v1"' in p3
          assert 'PROFILE_ID = "python-filesystem-v1"' in p4
          assert manifest["version"] == profile["authoritative_grading"]["toolchain_version"] == "2026.08.3"
          assert lock["version"] == "2026.07.1"
          assert profile["thebitlab"]["pr"] == 768
          policy = profile["certification_policy"]
          assert policy["candidate_profile_only"] is True
          assert policy["mass_activity_materialization_allowed"] is False
          assert policy["immutable_release_lock_required_before_stable"] is True
          assert policy["combined_p2_p3_p4_toolchain_required"] is True
          PY

      - name: Build exact combined assignment runner
        working-directory: _thebitlab-p2
        run: >-
          python scripts/build_assignment_runner.py
          --source-revision "${{ steps.p2.outputs.ref }}"
          --tag "${{ steps.p2.outputs.image }}"
          --metadata "$RUNNER_TEMP/python-docente-p2-runner.json"

      - name: Verify built combined toolchain identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          profile = json.loads(Path("config/p2-canary-profile.json").read_text(encoding="utf-8"))
          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "python-docente-p2-runner.json").read_text(encoding="utf-8"))
          assert metadata["version"] == profile["authoritative_grading"]["toolchain_version"]
          assert metadata["source_revision"] == profile["thebitlab"]["ref"]
          assert metadata["platform"] == profile["authoritative_grading"]["platform"]
          PY

      - name: Run real M13 P2 consumer
        run: >-
          python tests/p2_m13_consumer.py
          --platform _thebitlab-p2
          --docker-image "${{ steps.p2.outputs.image }}"
