name: TheBitLab Python vertical slice

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  python-vertical-slice:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout python-docente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run static course quality suite
        run: python scripts/run_static_quality.py

      - name: Checkout pinned TheBitLab baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TheBitPoets/2cornot2c
          ref: cdcdf4a6c9a3b1e28cc0a9702ca4f69a521849b0
          path: _thebitlab-platform

      - name: Validate Course Board external workspace round-trip
        run: python tests/course_board_workspace_roundtrip.py --platform _thebitlab-platform

      - name: Validate managed Course Board Activity assignment
        run: python tests/course_board_managed_assignment.py --platform _thebitlab-platform

      - name: Validate first Python consumer on host Python 3.12
        run: python tests/thebitlab_python_smoke.py --platform _thebitlab-platform

      - name: Authenticate to GHCR for pinned runner
        if: runner.os == 'Linux'
        shell: bash
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull authoritative immutable Docker runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          eval "$(python - <<'PY'
          import json
          import shlex
          from pathlib import Path
          profile = json.loads(Path('config/p1-canary-profile.json').read_text(encoding='utf-8'))
          grading = profile['authoritative_grading']
          reference = grading['immutable_reference']
          repository = reference.split('@', 1)[0]
          version = grading['toolchain_version']
          print('RUNNER_IMAGE=' + shlex.quote(reference))
          print('RUNNER_VERSION_TAG=' + shlex.quote(f'{repository}:{version}'))
          PY
          )"

          echo "Pulling pinned grading image: $RUNNER_IMAGE"
          if ! docker pull "$RUNNER_IMAGE"; then
            echo "Locked manifest is unavailable from this repository token. Diagnostic only: inspect version tag $RUNNER_VERSION_TAG"
            if docker pull "$RUNNER_VERSION_TAG"; then
              docker image inspect "$RUNNER_VERSION_TAG" --format 'Diagnostic ImageId={{.Id}} RepoDigests={{json .RepoDigests}} Labels={{json .Config.Labels}}'
            else
              echo "Version tag is also inaccessible from this repository token."
            fi
            echo "FAIL: authoritative lock remains unchanged; no alternate tag is accepted for grading."
            exit 1
          fi
          docker image inspect "$RUNNER_IMAGE" --format 'ImageId={{.Id}} RepoDigests={{json .RepoDigests}} Labels={{json .Config.Labels}}'

      - name: Validate authoritative immutable Docker grading
        if: runner.os == 'Linux'
        run: python tests/thebitlab_python_smoke.py --platform _thebitlab-platform --authoritative-docker
