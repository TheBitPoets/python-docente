name: Normalize authoring catalog once

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-normalize-once.yml"

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoring branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/course-architecture
          fetch-depth: 0

      - name: Normalize catalog from canonical module filenames
        run: python scripts/sync_authoring_catalog.py --write

      - name: Commit normalized machine documents if needed
        shell: bash
        run: |
          if git diff --quiet -- content/python/content-pack.json doc/course_design.json; then
            echo "No catalog migration needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/python/content-pack.json doc/course_design.json
          git commit -m "catalog: normalize 1-based Content Pack order"
          git push origin HEAD:agent/course-architecture
