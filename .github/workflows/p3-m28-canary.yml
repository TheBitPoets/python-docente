name: Python M28 P3 canary

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "activities/python/py2-activity-b-serbatoio-invariante-001/**"
      - "config/p3-canary-profile.json"
      - "tests/p3_m28_consumer.py"
      - ".github/workflows/p3-m28-canary.yml"

jobs:
  m28-p3-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout python-docente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Resolve immutable P3 grading release
        id: p3
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          profile = json.loads(Path("config/p3-canary-profile.json").read_text(encoding="utf-8"))
          grading = profile["authoritative_grading"]
          print("ref=" + profile["thebitlab"]["ref"])
          print("image=" + grading["immutable_image_reference"])
          print("digest=" + grading["digest"])
          print("version=" + grading["toolchain_version"])
          PY

      - name: Checkout exact published TheBitLab source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TheBitPoets/2cornot2c
          ref: ${{ steps.p3.outputs.ref }}
          path: _thebitlab-p3
          persist-credentials: false

      - name: Verify published P2 P3 P4 release identity
        shell: bash
        run: |
          test "$(git -C _thebitlab-p3 rev-parse HEAD)" = "${{ steps.p3.outputs.ref }}"
          python - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("config/p3-canary-profile.json").read_text(encoding="utf-8"))
          root = Path("_thebitlab-p3")
          p2 = (root / "scripts" / "python_function_profile.py").read_text(encoding="utf-8")
          p3 = (root / "scripts" / "python_object_profile.py").read_text(encoding="utf-8")
          p4 = (root / "scripts" / "python_filesystem_profile.py").read_text(encoding="utf-8")
          manifest = json.loads((root / "docker" / "assignment-runner" / "toolchain.json").read_text(encoding="utf-8"))
          grading = profile["authoritative_grading"]
          assert 'PROFILE_ID = "python-function-v1"' in p2
          assert 'PROFILE_ID = "python-object-v1"' in p3
          assert 'PROFILE_ID = "python-filesystem-v1"' in p4
          assert manifest["version"] == grading["toolchain_version"] == "2026.08.3"
          assert profile["thebitlab"]["pr"] == 770
          assert profile["thebitlab"]["stable_lock_pr"] == 771
          assert profile["thebitlab"]["profile_lineage_pr"] == 767
          assert profile["thebitlab"]["issue"] == 758
          assert grading["strategy"] == "pull-immutable-ghcr-release"
          assert grading["release_identity_status"] == "published-immutable-stable"
          assert grading["immutable_image_reference"].endswith("@" + grading["digest"])
          policy = profile["certification_policy"]
          assert policy["candidate_profile_only"] is False
          assert policy["mass_activity_materialization_allowed"] is False
          assert policy["normal_student_lab_dispatch_certified_upstream"] is True
          assert policy["student_report_redaction_required"] is True
          assert policy["immutable_release_lock_verified"] is True
          assert policy["combined_p2_p3_p4_toolchain_required"] is True
          PY

      - name: Authenticate to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull exact immutable runner
        shell: bash
        run: |
          test "${{ steps.p3.outputs.image }}" = "ghcr.io/thebitpoets/2cornot2c-assignment-runner@${{ steps.p3.outputs.digest }}"
          docker pull "${{ steps.p3.outputs.image }}"
          docker image inspect "${{ steps.p3.outputs.image }}" >/dev/null

      - name: Run real M28 P3 consumer
        run: >-
          python tests/p3_m28_consumer.py
          --platform _thebitlab-p3
          --docker-image "${{ steps.p3.outputs.image }}"
