name: Python slide release artifacts

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Optional release/build id recorded in provenance manifest
        required: false
        type: string
  # Temporary first-real-build trigger. Remove after #10 has real artifact evidence.
  pull_request:
    paths:
      - ".github/workflows/slide-artifacts.yml"

permissions:
  contents: read

jobs:
  build-slide-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout python-docente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned slide-release QA dependencies
        run: python -m pip install -r requirements-slide-release.txt

      - name: Validate slide sources and pinned build profile
        run: |
          python tests/slide_source_quality.py
          python tests/slide_build_profile.py

      - name: Pull pinned Marp release image
        run: docker pull ghcr.io/marp-team/marp-cli@sha256:119010dd06f8dd256b47f6479d9d3c83fcbfdcac5f873d0d03db5320f130cf87

      - name: Build and validate HTML PDF PPTX artifacts
        env:
          REQUESTED_BUILD_ID: ${{ inputs.build_id }}
        shell: bash
        run: |
          BUILD_ID="$REQUESTED_BUILD_ID"
          if [ -z "$BUILD_ID" ]; then
            BUILD_ID="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          python scripts/build_slide_artifacts.py --build-id "$BUILD_ID"

      - name: Upload validated slide artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-slide-release-${{ github.sha }}
          path: dist/slides/python/
          if-no-files-found: error
          retention-days: 14
