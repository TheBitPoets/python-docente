name: Certify Python slide artifacts 2026-08-27

on:
  push:
    branches:
      - agent/course-architecture
    paths:
      - ".github/workflows/slide-artifacts-certify-2026-08-27.yml"

permissions:
  contents: read

jobs:
  build-slide-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact python-docente candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate slide sources and pinned build profile
        run: |
          python tests/slide_source_quality.py
          python tests/slide_build_profile.py

      - name: Pull pinned Marp release image
        run: docker pull ghcr.io/marp-team/marp-cli@sha256:119010dd06f8dd256b47f6479d9d3c83fcbfdcac5f873d0d03db5320f130cf87

      - name: Build and structurally validate all slide artifacts
        run: python scripts/build_slide_artifacts.py --build-id "certify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Show validated artifact inventory
        shell: bash
        run: |
          find dist/slides/python -type f -maxdepth 3 -print | sort
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/slides/python/build-manifest.json').read_text(encoding='utf-8'))
          modules = manifest['modules']
          counts = {'html': 0, 'pdf': 0, 'pptx': 0}
          total_bytes = {'html': 0, 'pdf': 0, 'pptx': 0}
          for module in modules:
              for kind in counts:
                  artifact = module['artifacts'][kind]
                  counts[kind] += 1
                  total_bytes[kind] += artifact['bytes']
          if counts != {'html': 27, 'pdf': 27, 'pptx': 27}:
              raise SystemExit(f'Unexpected artifact counts: {counts}')
          print(f'Module count: {len(modules)}')
          print(f'Artifact counts: {counts}')
          print(f'Artifact bytes: {total_bytes}')
          PY

      - name: Upload validated slide artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-slide-release-${{ github.sha }}
          path: dist/slides/python/
          if-no-files-found: error
          retention-days: 14
