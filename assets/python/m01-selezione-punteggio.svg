<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Punteggio: conta la prima condizione vera</title>
  <desc id="desc">Con punteggio &gt;= 90 mostriamo fascia alta e saltiamo il secondo confronto. Altrimenti controlliamo punteggio &gt;= 60: se vero fascia media, se falso fascia bassa.</desc>
