  <rect width="1920" height="1080" fill="#08192c" />
  <g font-family="Arial, sans-serif">
    <text x="64" y="96" text-anchor="start" font-size="48" fill="#f8fafc">Punteggio: conta la prima condizione vera</text>
    <text x="64" y="148" text-anchor="start" font-size="28" fill="#b9ccdf">La seconda condizione viene controllata solo se la prima è falsa.</text>
    <rect x="360.0" y="188" width="240" height="72" rx="36" fill="#dbeafe" stroke="#2563eb" stroke-width="4" id="node-start" />
