<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../catalog/catalog-1.svg">
<title id="title">Oggetti Python &#183; tavola 1</title>
<desc id="desc">Catalogo dei componenti riutilizzabili con nome e identificatore stabile. I colori accompagnano sempre le etichette.</desc>
<defs id="visual-kit-components"/>
<rect width="1920" height="1080" fill="{{canvas}}"/>
<g font-family="{{family}}">
<text x="64" y="100" font-size="48" fill="{{surface}}">Oggetti Python &#183; tavola 1 / 3</text>
<text x="64" y="152" font-size="28" fill="{{muted}}">Stesso concetto, stesso oggetto &#183; simboli senza etichette incorporate</text>
<rect x="64" y="200" width="576" height="248" rx="20" fill="{{surface}}"/>
<use href="#tpsi-document" x="88" y="220" width="150" height="168"/>
<text x="260" y="294" font-size="26" fill="{{ink}}">Documento / sorgente</text>
<text x="260" y="346" font-size="23" fill="{{data}}">tpsi-document</text>
<rect x="672" y="200" width="576" height="248" rx="20" fill="{{surface}}"/>
<use href="#tpsi-terminal" x="696" y="220" width="150" height="168"/>
<text x="868" y="294" font-size="26" fill="{{ink}}">Terminale / REPL</text>
<text x="868" y="346" font-size="23" fill="{{data}}">tpsi-terminal</text>
<rect x="1280" y="200" width="576" height="248" rx="20" fill="{{surface}}"/>
<use href="#tpsi-repository" x="1304" y="220" width="150" height="168"/>
<text x="1476" y="294" font-size="26" fill="{{ink}}">Repository</text>
<text x="1476" y="346" font-size="23" fill="{{data}}">tpsi-repository</text>
<rect x="64" y="480" width="576" height="248" rx="20" fill="{{surface}}"/>
<use href="#tpsi-test" x="88" y="500" width="150" height="168"/>
<text x="260" y="574" font-size="26" fill="{{ink}}">Caso di test</text>
<text x="260" y="626" font-size="23" fill="{{data}}">tpsi-test</text>
<rect x="672" y="480" width="576" height="248" rx="20" fill="{{surface}}"/>
<use href="#tpsi-step" x="696" y="500" width="150" height="168"/>
<text x="868" y="574" font-size="26" fill="{{ink}}">Passo di elaborazione</text>
<text x="868" y="626" font-size="23" fill="{{data}}">tpsi-step</text>
