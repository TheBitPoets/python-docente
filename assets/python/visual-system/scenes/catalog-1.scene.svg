<use href="#tpsi-decision" x="696" y="780" width="150" height="168"/>
<text x="868" y="854" font-size="26" fill="{{ink}}">Decisione</text>
<text x="868" y="906" font-size="23" fill="{{data}}">tpsi-decision</text>
<rect x="1280" y="760" width="576" height="248" rx="20" fill="{{surface}}"/>
<use href="#tpsi-binding" x="1304" y="780" width="150" height="168"/>
