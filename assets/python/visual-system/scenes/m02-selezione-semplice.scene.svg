<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m02-selezione-semplice.svg">
  <title id="title">Selezione semplice: un avviso se serve</title>
  <desc id="desc">Se saldo &lt; 0? è true si mostra AVVISO; il ramo false salta l’avviso. Entrambi raggiungono il prossimo passo.</desc>
  <defs id="visual-kit-components" />
  <defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="{{line}}" /></marker></defs>
  <rect width="1920" height="1080" fill="{{canvas}}" />
  <g font-family="{{family}}">
<text x="64" y="96" text-anchor="start" font-size="48" fill="{{surface}}">Selezione semplice: un avviso se serve</text>
<text x="64" y="148" text-anchor="start" font-size="28" fill="{{muted}}">Il ramo false continua senza eseguire un’azione specifica.</text>
<text x="64" y="1032" text-anchor="start" font-size="28" fill="{{muted}}">Frecce = flusso di esecuzione; true = vero, false = falso.</text>
<path d="M960 248 L1200.0 336.0 L960 424 L720.0 336.0 Z" fill="#fef3c7" stroke="{{runtime}}" stroke-width="4" />
<text x="960" y="346.0" text-anchor="middle" font-size="30" fill="{{ink}}">saldo &lt; 0?</text>
<path d="M720 336 H500 V552" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M1200 336 H1420 V552" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="610.0" y="312" text-anchor="middle" font-size="30" fill="{{line}}">true</text>
<text x="1310.0" y="312" text-anchor="middle" font-size="30" fill="{{line}}">false</text>
<path d="M304.0 552 H720.0 L696.0 632 H280.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="500" y="602.0" text-anchor="middle" font-size="30" fill="{{ink}}">OUTPUT AVVISO</text>
<path d="M500 632 V776 H960" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M1420 552 V776 H960" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<circle cx="960" cy="776" r="7" fill="{{line}}" />
<path d="M960 776 V864" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<rect x="740.0" y="864" width="440" height="80" rx="0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="960" y="914.0" text-anchor="middle" font-size="30" fill="{{ink}}">prossimo passo</text>
  </g>
</svg>
