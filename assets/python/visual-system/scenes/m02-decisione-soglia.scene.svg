<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m02-decisione-soglia.svg">
  <title id="title">Una condizione, due possibilità</title>
  <desc id="desc">Il rombo temperatura &gt; 30? porta con true a OUTPUT sopra soglia e con false a OUTPUT entro soglia.</desc>
  <defs id="visual-kit-components" />
  <defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="{{line}}" /></marker></defs>
  <rect width="1920" height="1080" fill="{{canvas}}" />
  <g font-family="{{family}}">
<text x="64" y="96" text-anchor="start" font-size="48" fill="{{surface}}">Una condizione, due possibilità</text>
<text x="64" y="148" text-anchor="start" font-size="28" fill="{{muted}}">La condizione ha sempre un esito vero oppure falso.</text>
<text x="64" y="1032" text-anchor="start" font-size="28" fill="{{muted}}">Frecce = flusso di esecuzione; true = vero, false = falso.</text>
<path d="M960 280 L1240.0 380.0 L960 480 L680.0 380.0 Z" fill="#fef3c7" stroke="{{runtime}}" stroke-width="4" />
<text x="960" y="390.0" text-anchor="middle" font-size="30" fill="{{ink}}">temperatura &gt; 30?</text>
<path d="M680 380 H500 V640" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M1240 380 H1420 V640" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="590.0" y="356" text-anchor="middle" font-size="30" fill="{{line}}">true</text>
<text x="1330.0" y="356" text-anchor="middle" font-size="30" fill="{{line}}">false</text>
<path d="M284.0 640 H740.0 L716.0 752 H260.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="500" y="688.0" text-anchor="middle" font-size="30" fill="{{ink}}">OUTPUT</text>
<text x="500" y="724.0" text-anchor="middle" font-size="30" fill="{{ink}}">“sopra soglia”</text>
<path d="M1204.0 640 H1660.0 L1636.0 752 H1180.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="1420" y="688.0" text-anchor="middle" font-size="30" fill="{{ink}}">OUTPUT</text>
<text x="1420" y="724.0" text-anchor="middle" font-size="30" fill="{{ink}}">“entro soglia”</text>
  </g>
</svg>
