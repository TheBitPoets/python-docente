<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../lab-m02-m03-11.svg">
  <title id="title">11. Contare i numeri pari</title>
  <desc id="desc">i e conteggio partono da zero. Si leggono cinque numeri; se numero modulo 2 è zero si incrementa conteggio. i aumenta sempre. Dopo cinque letture si mostra conteggio.</desc>
  <defs id="visual-kit-components" />
  <defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="{{line}}" /></marker></defs>
  <rect width="1920" height="1080" fill="{{canvas}}" />
  <g font-family="{{family}}">
<text x="64" y="96" font-size="48" text-anchor="start" fill="{{surface}}">11. Contare i numeri pari</text>
<text x="64" y="148" font-size="28" text-anchor="start" fill="{{muted}}">La selezione decide se contare il dato; il ciclo decide quante letture eseguire.</text>
<text x="64" y="1032" font-size="28" text-anchor="start" fill="{{muted}}">Frecce = flusso di esecuzione; true = vero, false = falso. ← dentro un nodo = assegnamento.</text>
<rect x="760.0" y="176" width="240" height="48" rx="24.0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="880" y="210.0" font-size="30" text-anchor="middle" fill="{{ink}}">INIZIO</text>
<path d="M880 224 V256" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<rect x="640.0" y="256" width="480" height="80" rx="0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="880" y="288.0" font-size="30" text-anchor="middle" fill="{{ink}}">i ← 0</text>
<text x="880" y="324.0" font-size="30" text-anchor="middle" fill="{{ink}}">conteggio ← 0</text>
<path d="M880 336 V376" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<circle cx="880" cy="352" r="6" fill="{{line}}" />
<path d="M880 376 L1080.0 432.0 L880 488 L680.0 432.0 Z" fill="#fef3c7" stroke="{{runtime}}" stroke-width="4" />
<text x="880" y="442.0" font-size="30" text-anchor="middle" fill="{{ink}}">i &lt; 5?</text>
<path d="M880 488 V536" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="928" y="524" font-size="28" text-anchor="middle" fill="{{line}}">true</text>
<path d="M704.0 536 H1080.0 L1056.0 600 H680.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="880" y="578.0" font-size="30" text-anchor="middle" fill="{{ink}}">LEGGI numero</text>
<path d="M880 600 V648" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M880 648 L1140.0 712.0 L880 776 L620.0 712.0 Z" fill="#fef3c7" stroke="{{runtime}}" stroke-width="4" />
<text x="880" y="722.0" font-size="30" text-anchor="middle" fill="{{ink}}">numero % 2 == 0?</text>
<path d="M1140 712 H1344 V808" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="1248" y="688" font-size="28" text-anchor="middle" fill="{{line}}">true</text>
<rect x="1064.0" y="808" width="560" height="64" rx="0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="1344" y="850.0" font-size="30" text-anchor="middle" fill="{{ink}}">conteggio ← conteggio + 1</text>
<path d="M1344 872 V904 H880" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M620 712 H552 V904 H880" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="544" y="688" font-size="28" text-anchor="middle" fill="{{line}}">false</text>
<circle cx="880" cy="904" r="6" fill="{{line}}" />
<path d="M880 904 V928" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<rect x="680.0" y="928" width="400" height="64" rx="0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="880" y="970.0" font-size="30" text-anchor="middle" fill="{{ink}}">i ← i + 1</text>
<path d="M880 992 H368 V352 H880" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M1080 432 H1664 V536" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="1360" y="408" font-size="28" text-anchor="middle" fill="{{line}}">false</text>
<path d="M1496.0 536 H1856.0 L1832.0 600 H1472.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="1664" y="578.0" font-size="30" text-anchor="middle" fill="{{ink}}">MOSTRA conteggio</text>
<path d="M1664 600 V648" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<rect x="1544.0" y="648" width="240" height="64" rx="32.0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="1664" y="690.0" font-size="30" text-anchor="middle" fill="{{ink}}">FINE</text>
  </g>
</svg>
