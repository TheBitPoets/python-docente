<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m01-specifica.svg">
<title id="title">Dalla specifica al contratto di input e output</title><desc id="desc">Una consegna sui prezzi viene scomposta in dati di ingresso, risultato atteso e caso degli importi uguali.</desc><defs id="visual-kit-components"/><rect width="1920" height="1080" fill="{{canvas}}"/><g font-family="{{family}}"><text x="64" y="100" font-size="48" fill="{{surface}}">Una specifica è un contratto</text><text x="64" y="150" font-size="28" fill="{{muted}}">Ogni input ammesso deve produrre un output definito.</text><rect x="64" y="245" width="560" height="560" rx="24" fill="{{panel}}"/><use href="#tpsi-document" x="255" y="300" width="180" height="136"/><text x="130" y="520" font-size="34" fill="{{surface}}">CONSEGNA</text><text x="130" y="580" font-size="28" fill="{{muted}}">Leggi due prezzi.</text><text x="130" y="630" font-size="28" fill="{{muted}}">Indica il maggiore.</text><text x="130" y="680" font-size="28" fill="{{muted}}">Dichiara se sono uguali.</text><rect x="710" y="245" width="500" height="560" rx="24" fill="{{panel}}"/><use href="#tpsi-value" x="870" y="300" width="180" height="136"/><text x="790" y="520" font-size="34" fill="{{surface}}">INPUT</text><text x="790" y="580" font-size="28" fill="{{muted}}">prezzo A</text><text x="790" y="630" font-size="28" fill="{{muted}}">prezzo B</text><rect x="1296" y="245" width="560" height="560" rx="24" fill="{{panel}}"/><use href="#tpsi-decision" x="1485" y="300" width="180" height="136"/><text x="1370" y="520" font-size="34" fill="{{surface}}">OUTPUT</text><text x="1370" y="580" font-size="28" fill="{{muted}}">A maggiore</text><text x="1370" y="630" font-size="28" fill="{{muted}}">B maggiore</text><text x="1370" y="680" font-size="28" fill="{{muted}}">oppure uguali</text><g fill="none" stroke="{{line}}" stroke-width="8"><path d="M630 525H690"/><path d="M1215 525H1275"/></g><text x="64" y="930" font-size="30" fill="{{surface}}">La parola “uguali” chiude un caso che altrimenti resterebbe senza risposta.</text></g></svg>
