<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m01-decomposizione.svg">
<title id="title">Decomposizione di un problema in passi</title><desc id="desc">Cinque passi collegati trasformano due prezzi in un risultato comunicabile.</desc><defs id="visual-kit-components"/><rect width="1920" height="1080" fill="{{canvas}}"/><g font-family="{{family}}"><text x="64" y="100" font-size="48" fill="{{surface}}">Decomporre rende controllabile il lavoro</text><text x="64" y="150" font-size="28" fill="{{muted}}">Ogni passo prepara il successivo e può essere verificato separatamente.</text><g fill="{{panel}}"><rect x="64" y="270" width="320" height="360" rx="24"/><rect x="430" y="270" width="320" height="360" rx="24"/><rect x="796" y="270" width="320" height="360" rx="24"/><rect x="1162" y="270" width="320" height="360" rx="24"/><rect x="1528" y="270" width="320" height="360" rx="24"/></g><g fill="{{surface}}" font-size="30" text-anchor="middle"><text x="224" y="350">1</text><text x="590" y="350">2</text><text x="956" y="350">3</text><text x="1322" y="350">4</text><text x="1688" y="350">5</text></g><g fill="{{muted}}" font-size="27" text-anchor="middle"><text x="224" y="450">acquisisci</text><text x="224" y="490">A</text><text x="590" y="450">acquisisci</text><text x="590" y="490">B</text><text x="956" y="450">confronta</text><text x="956" y="490">A e B</text><text x="1322" y="450">scegli</text><text x="1322" y="490">il caso</text><text x="1688" y="450">comunica</text><text x="1688" y="490">il risultato</text></g><g fill="none" stroke="{{line}}" stroke-width="8"><path d="M390 450H415"/><path d="M756 450H781"/><path d="M1122 450H1147"/><path d="M1488 450H1513"/></g><text x="64" y="860" font-size="30" fill="{{surface}}">Non aggiungiamo gesti inutili: rendiamo esplicite decisioni, trasformazioni e controlli.</text></g></svg>
