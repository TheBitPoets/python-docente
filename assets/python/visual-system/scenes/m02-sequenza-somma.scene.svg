<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m02-sequenza-somma.svg">
  <title id="title">Una sequenza: sommare due numeri</title>
  <desc id="desc">START, INPUT A, INPUT B, SOMMA ← A + B, OUTPUT SOMMA, END: i passi vengono eseguiti in questo ordine.</desc>
  <defs id="visual-kit-components" />
  <defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="{{line}}" /></marker></defs>
  <rect width="1920" height="1080" fill="{{canvas}}" />
  <g font-family="{{family}}">
<text x="64" y="96" text-anchor="start" font-size="48" fill="{{surface}}">Una sequenza: sommare due numeri</text>
<text x="64" y="148" text-anchor="start" font-size="28" fill="{{muted}}">Ogni passo ha un solo successore, fino a END.</text>
<text x="64" y="1032" text-anchor="start" font-size="28" fill="{{muted}}">Frecce = flusso di esecuzione. Il rettangolo calcola; il parallelogramma legge o mostra dati.</text>
<rect x="720.0" y="208" width="480" height="80" rx="40.0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="960" y="258.0" text-anchor="middle" font-size="30" fill="{{ink}}">START</text>
<path d="M960 288 V344" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M744.0 344 H1200.0 L1176.0 424 H720.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="960" y="394.0" text-anchor="middle" font-size="30" fill="{{ink}}">INPUT A</text>
<path d="M960 424 V480" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M744.0 480 H1200.0 L1176.0 560 H720.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="960" y="530.0" text-anchor="middle" font-size="30" fill="{{ink}}">INPUT B</text>
<path d="M960 560 V616" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<rect x="720.0" y="616" width="480" height="80" rx="0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="960" y="666.0" text-anchor="middle" font-size="30" fill="{{ink}}">SOMMA ← A + B</text>
<path d="M960 696 V752" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M744.0 752 H1200.0 L1176.0 832 H720.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="960" y="802.0" text-anchor="middle" font-size="30" fill="{{ink}}">OUTPUT SOMMA</text>
<path d="M960 832 V888" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<rect x="720.0" y="888" width="480" height="80" rx="40.0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="960" y="938.0" text-anchor="middle" font-size="30" fill="{{ink}}">END</text>
  </g>
</svg>
