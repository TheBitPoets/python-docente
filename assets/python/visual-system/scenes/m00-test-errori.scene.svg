<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m00-test-errori.svg">
<title id="title">Test diversi e diagnosi degli errori</title>
<desc id="desc">Il diagramma mostra casi normali, limite e controesempio per il maggiore fra due numeri, poi distingue errore di comprensione, algoritmo ed esecuzione.</desc>
<defs id="visual-kit-components"/><defs><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="6" orient="auto"><path d="M0 0L13 6L0 12z" fill="{{line}}"/></marker></defs>
<rect width="1920" height="1080" fill="{{canvas}}"/><g font-family="{{family}}"><text x="64" y="100" font-size="48" fill="{{surface}}">Un esempio mostra un caso; i test esplorano il comportamento</text><text x="64" y="150" font-size="28" fill="{{muted}}">Per il maggiore fra due numeri, cambiamo la relazione fra i dati.</text>
<rect x="64" y="230" width="1000" height="690" rx="24" fill="{{panel}}"/><rect x="1120" y="230" width="736" height="690" rx="24" fill="{{panel}}"/>
<text x="120" y="300" font-size="36" fill="{{surface}}">Casi da provare</text><g font-size="28"><rect x="120" y="350" width="870" height="115" rx="15" fill="#dbeafe"/><text x="155" y="400" fill="{{ink}}">Normale: A=8, B=3</text><text x="155" y="440" fill="{{ink}}">Risultato atteso: 8</text><rect x="120" y="490" width="870" height="115" rx="15" fill="#fef3c7"/><text x="155" y="540" fill="{{ink}}">Limite: A=5, B=5</text><text x="155" y="580" fill="{{ink}}">Risultato atteso: 5</text><rect x="120" y="630" width="870" height="115" rx="15" fill="#ccfbf1"/><text x="155" y="680" fill="{{ink}}">Ordine invertito: A=3, B=8</text><text x="155" y="720" fill="{{ink}}">Risultato atteso: 8</text></g><text x="120" y="820" font-size="27" fill="{{muted}}">Un solo risultato corretto non copre tutti questi casi.</text>
<text x="1170" y="300" font-size="36" fill="{{surface}}">Dove nasce l'errore?</text><use href="#tpsi-document" x="1180" y="350" width="120" height="145"/><text x="1320" y="420" font-size="27" fill="{{muted}}">Comprensione: ho scelto</text><text x="1320" y="458" font-size="27" fill="{{muted}}">la richiesta sbagliata.</text><use href="#tpsi-error" x="1180" y="540" width="120" height="100"/><text x="1320" y="585" font-size="27" fill="{{muted}}">Algoritmo: ho ordinato</text><text x="1320" y="623" font-size="27" fill="{{muted}}">male i passi.</text><use href="#tpsi-terminal" x="1170" y="700" width="150" height="100"/><text x="1340" y="745" font-size="27" fill="{{muted}}">Esecuzione: il futuro</text><text x="1340" y="783" font-size="27" fill="{{muted}}">programma non parte o fallisce.</text></g></svg>
