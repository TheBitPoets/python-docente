<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m02-selezione-doppia.svg">
  <title id="title">Selezione doppia: due rami, una decisione</title>
  <desc id="desc">Dopo START e INPUT temperatura, temperatura &gt; 30? sceglie OUTPUT alta sul ramo true oppure OUTPUT normale sul ramo false. I rami si ricongiungono prima di END.</desc>
  <defs id="visual-kit-components" />
  <defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="{{line}}" /></marker></defs>
  <rect width="1920" height="1080" fill="{{canvas}}" />
  <g font-family="{{family}}">
<text x="64" y="96" text-anchor="start" font-size="48" fill="{{surface}}">Selezione doppia: due rami, una decisione</text>
<text x="64" y="148" text-anchor="start" font-size="28" fill="{{muted}}">Un solo output viene eseguito per ciascun valore di temperatura.</text>
<text x="64" y="1032" text-anchor="start" font-size="28" fill="{{muted}}">Frecce = flusso di esecuzione; true = vero, false = falso.</text>
<rect x="840.0" y="208" width="240" height="72" rx="36.0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="960" y="254.0" text-anchor="middle" font-size="30" fill="{{ink}}">START</text>
<path d="M960 280 V320" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M744.0 320 H1200.0 L1176.0 400 H720.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="960" y="370.0" text-anchor="middle" font-size="30" fill="{{ink}}">INPUT temperatura</text>
<path d="M960 400 V448" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M960 448 L1240.0 536.0 L960 624 L680.0 536.0 Z" fill="#fef3c7" stroke="{{runtime}}" stroke-width="4" />
<text x="960" y="546.0" text-anchor="middle" font-size="30" fill="{{ink}}">temperatura &gt; 30?</text>
<path d="M680 536 H500 V676" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M1240 536 H1420 V676" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="590.0" y="512" text-anchor="middle" font-size="30" fill="{{line}}">true</text>
<text x="1330.0" y="512" text-anchor="middle" font-size="30" fill="{{line}}">false</text>
<path d="M304.0 676 H720.0 L696.0 756 H280.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="500" y="726.0" text-anchor="middle" font-size="30" fill="{{ink}}">OUTPUT alta</text>
<path d="M1224.0 676 H1640.0 L1616.0 756 H1200.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="1420" y="726.0" text-anchor="middle" font-size="30" fill="{{ink}}">OUTPUT normale</text>
<path d="M500 756 V848 H960" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M1420 756 V848 H960" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<circle cx="960" cy="848" r="7" fill="{{line}}" />
<path d="M960 848 V904" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<rect x="840.0" y="904" width="240" height="72" rx="36.0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="960" y="950.0" text-anchor="middle" font-size="30" fill="{{ink}}">END</text>
  </g>
</svg>
