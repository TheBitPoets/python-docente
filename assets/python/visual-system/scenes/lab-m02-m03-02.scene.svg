<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../lab-m02-m03-02.svg">
  <title id="title">2. Pari oppure dispari</title>
  <desc id="desc">Si legge numero. Se numero % 2 == 0 è vero si mostra &quot;pari&quot;, altrimenti si mostra &quot;dispari&quot;. I rami si ricongiungono prima della fine.</desc>
  <defs id="visual-kit-components" />
  <defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="{{line}}" /></marker></defs>
  <rect width="1920" height="1080" fill="{{canvas}}" />
  <g font-family="{{family}}">
<text x="64" y="96" font-size="48" text-anchor="start" fill="{{surface}}">2. Pari oppure dispari</text>
<text x="64" y="148" font-size="28" text-anchor="start" fill="{{muted}}">Una condizione, due rami alternativi: viene eseguito un solo output.</text>
<text x="64" y="1032" font-size="28" text-anchor="start" fill="{{muted}}">Frecce = flusso di esecuzione; true = vero, false = falso. ← dentro un nodo = assegnamento.</text>
<rect x="840.0" y="184" width="240" height="56" rx="28.0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="960" y="222.0" font-size="30" text-anchor="middle" fill="{{ink}}">INIZIO</text>
<path d="M960 240 V280" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M744.0 280 H1200.0 L1176.0 352 H720.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="960" y="326.0" font-size="30" text-anchor="middle" fill="{{ink}}">LEGGI numero</text>
<path d="M960 352 V400" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M960 400 L1240.0 472.0 L960 544 L680.0 472.0 Z" fill="#fef3c7" stroke="{{runtime}}" stroke-width="4" />
<text x="960" y="482.0" font-size="30" text-anchor="middle" fill="{{ink}}">numero % 2 == 0?</text>
<path d="M680 472 H480 V640" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="568" y="448" font-size="30" text-anchor="middle" fill="{{line}}">true</text>
<path d="M1240 472 H1440 V640" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="1352" y="448" font-size="30" text-anchor="middle" fill="{{line}}">false</text>
<path d="M264.0 640 H720.0 L696.0 712 H240.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="480" y="686.0" font-size="30" text-anchor="middle" fill="{{ink}}">MOSTRA &quot;pari&quot;</text>
<path d="M1224.0 640 H1680.0 L1656.0 712 H1200.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="1440" y="686.0" font-size="30" text-anchor="middle" fill="{{ink}}">MOSTRA &quot;dispari&quot;</text>
<path d="M480 712 V840 H960" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M1440 712 V840 H960" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<circle cx="960" cy="840" r="6" fill="{{line}}" />
<path d="M960 840 V912" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<rect x="840.0" y="912" width="240" height="64" rx="32.0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="960" y="954.0" font-size="30" text-anchor="middle" fill="{{ink}}">FINE</text>
  </g>
</svg>
