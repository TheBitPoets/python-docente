<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m01-ordine-test.svg">
<title id="title">Ordine dei passi e casi di test</title><desc id="desc">Un programma deve calcolare prima di mostrare il risultato e deve essere provato con tre confronti complementari.</desc><defs id="visual-kit-components"/><rect width="1920" height="1080" fill="{{canvas}}"/><g font-family="{{family}}"><text x="64" y="100" font-size="48" fill="{{surface}}">Ordine corretto e test essenziali</text><text x="64" y="150" font-size="28" fill="{{muted}}">Prima rendiamo disponibile il valore; poi controlliamo i casi che cambiano l'esito.</text><rect x="64" y="250" width="760" height="530" rx="24" fill="{{panel}}"/><text x="120" y="330" font-size="34" fill="{{surface}}">Ordine dei passi</text><g fill="{{muted}}" font-size="29"><text x="140" y="440">1. LEGGI prezzo</text><text x="140" y="510">2. CALCOLA totale</text><text x="140" y="580">3. MOSTRA totale</text></g><path d="M470 425V455M470 495V525" stroke="{{line}}" stroke-width="7"/><rect x="930" y="250" width="926" height="530" rx="24" fill="{{panel}}"/><text x="990" y="330" font-size="34" fill="{{surface}}">Casi per “maggiore tra due prezzi”</text><g fill="{{muted}}" font-size="29"><text x="1000" y="440">10, 5 → primo maggiore</text><text x="1000" y="510">5, 10 → secondo maggiore</text><text x="1000" y="580">7, 7 → uguali</text></g><use href="#tpsi-decision" x="1650" y="430" width="120" height="120"/><text x="64" y="920" font-size="30" fill="{{surface}}">Un test non è un esempio decorativo: verifica un ramo preciso della specifica.</text></g></svg>
