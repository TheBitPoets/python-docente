<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m00-passi-operativi.svg">
<title id="title">Da parole vaghe a passi operativi</title>
<desc id="desc">Il diagramma confronta una frase vaga con quattro passi osservabili: acquisire base, acquisire altezza, calcolare il prodotto e mostrare il risultato.</desc>
<defs id="visual-kit-components"/><defs><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="6" orient="auto"><path d="M0 0L13 6L0 12z" fill="{{line}}"/></marker></defs>
<rect width="1920" height="1080" fill="{{canvas}}"/><g font-family="{{family}}"><text x="64" y="100" font-size="48" fill="{{surface}}">Un passo è utile quando si può osservare</text><text x="64" y="150" font-size="28" fill="{{muted}}">“Fai il calcolo giusto” nasconde dati, trasformazione e risultato.</text>
<rect x="64" y="250" width="490" height="610" rx="24" fill="{{panel}}"/><rect x="680" y="250" width="1176" height="610" rx="24" fill="{{panel}}"/>
<use href="#tpsi-error" x="210" y="350" width="200" height="150"/><text x="130" y="590" font-size="38" fill="{{security}}">TROPPO VAGO</text><text x="130" y="650" font-size="28" fill="{{muted}}">“Fai il calcolo giusto”</text><text x="130" y="700" font-size="25" fill="{{muted}}">Che dati? Quale formula?</text><text x="130" y="745" font-size="25" fill="{{muted}}">Come controllo il risultato?</text>
<g fill="none" stroke="{{line}}" stroke-width="7" marker-end="url(#arrow)"><path d="M554 555H650"/></g><g><use href="#tpsi-step" x="740" y="340" width="230" height="172"/><use href="#tpsi-step" x="1010" y="340" width="230" height="172"/><use href="#tpsi-step" x="1280" y="340" width="230" height="172"/><use href="#tpsi-step" x="1550" y="340" width="230" height="172"/></g><g fill="{{surface}}" font-size="25"><text x="780" y="570">1. acquisisci base</text><text x="1030" y="570">2. acquisisci altezza</text><text x="1300" y="570">3. base × altezza</text><text x="1580" y="570">4. mostra prodotto</text></g><g fill="{{muted}}" font-size="23"><text x="760" y="680">dato osservabile</text><text x="1030" y="680">dato osservabile</text><text x="1300" y="680">trasformazione</text><text x="1580" y="680">risultato</text></g><path d="M970 426h40M1240 426h40M1510 426h40" stroke="{{line}}" stroke-width="7" marker-end="url(#arrow)"/><text x="740" y="790" font-size="27" fill="{{surface}}">Ogni passo deve lasciare abbastanza traccia perché un compagno possa seguirlo.</text></g></svg>
