<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m03-ciclo-nella-selezione.svg">
  <title id="title">Un ciclo dentro una selezione</title>
  <desc id="desc">Si legge scelta. Solo se scelta è esegui si inizializza i a zero e si mostra operazione tre volte incrementando i. Il ramo false salta l’intero ciclo e termina.</desc>
  <defs id="visual-kit-components" />
  <defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="{{line}}" /></marker></defs>
  <rect width="1920" height="1080" fill="{{canvas}}" />
  <g font-family="{{family}}">
<text x="64" y="96" font-size="48" text-anchor="start" fill="{{surface}}">Un ciclo dentro una selezione</text>
<text x="64" y="148" font-size="28" text-anchor="start" fill="{{muted}}">In questo esempio l’operazione ripetuta è mostrare il messaggio “operazione”.</text>
<text x="64" y="1032" font-size="28" text-anchor="start" fill="{{muted}}">Frecce = flusso di esecuzione; true = vero, false = falso.</text>
<path d="M744.0 184 H1200.0 L1176.0 264 H720.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="960" y="234.0" font-size="30" text-anchor="middle" fill="{{ink}}">LEGGI scelta</text>
<path d="M960 264 V312" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M960 312 L1240.0 376.0 L960 440 L680.0 376.0 Z" fill="#fef3c7" stroke="{{runtime}}" stroke-width="4" />
<text x="960" y="386.0" font-size="30" text-anchor="middle" fill="{{ink}}">scelta == “esegui”?</text>
<path d="M680 376 H640 V488" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="600" y="424" font-size="28" text-anchor="middle" fill="{{line}}">true</text>
<rect x="440.0" y="488" width="400" height="64" rx="0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="640" y="530.0" font-size="30" text-anchor="middle" fill="{{ink}}">i ← 0</text>
<path d="M640 552 V600" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<circle cx="640" cy="576" r="6" fill="{{line}}" />
<path d="M640 600 L840.0 664.0 L640 728 L440.0 664.0 Z" fill="#fef3c7" stroke="{{runtime}}" stroke-width="4" />
<text x="640" y="674.0" font-size="30" text-anchor="middle" fill="{{ink}}">i &lt; 3?</text>
<path d="M640 728 V776" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="688" y="764" font-size="28" text-anchor="middle" fill="{{line}}">true</text>
<path d="M424.0 776 H880.0 L856.0 840 H400.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="640" y="818.0" font-size="30" text-anchor="middle" fill="{{ink}}">MOSTRA “operazione”</text>
<path d="M640 840 V888" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<rect x="440.0" y="888" width="400" height="64" rx="0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="640" y="930.0" font-size="30" text-anchor="middle" fill="{{ink}}">i ← i + 1</text>
<path d="M640 952 V984 H176 V576 H640" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M840 664 H1496 V864" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="1040" y="640" font-size="28" text-anchor="middle" fill="{{line}}">false</text>
<path d="M1240 376 H1744 V864 H1496" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="1480" y="352" font-size="28" text-anchor="middle" fill="{{line}}">false</text>
<circle cx="1496" cy="864" r="6" fill="{{line}}" />
<path d="M1496 864 V920" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<rect x="1376.0" y="920" width="240" height="64" rx="32.0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="1496" y="962.0" font-size="30" text-anchor="middle" fill="{{ink}}">FINE</text>
  </g>
</svg>
