<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../lab-m02-m03-07.svg">
  <title id="title">7. Un voto valido</title>
  <desc id="desc">Si legge voto. Finché è minore di 0 o maggiore di 10 si legge di nuovo. Quando è valido si mostra il voto una sola volta e si termina.</desc>
  <defs id="visual-kit-components" />
  <defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="{{line}}" /></marker></defs>
  <rect width="1920" height="1080" fill="{{canvas}}" />
  <g font-family="{{family}}">
<text x="64" y="96" font-size="48" text-anchor="start" fill="{{surface}}">7. Un voto valido</text>
<text x="64" y="148" font-size="28" text-anchor="start" fill="{{muted}}">0 e 10 sono validi; la lettura nel corpo aggiorna il valore controllato.</text>
<text x="64" y="1032" font-size="28" text-anchor="start" fill="{{muted}}">Frecce = flusso di esecuzione; true = vero, false = falso. ← dentro un nodo = assegnamento.</text>
<rect x="640.0" y="176" width="240" height="56" rx="28.0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="760" y="214.0" font-size="30" text-anchor="middle" fill="{{ink}}">INIZIO</text>
<path d="M760 232 V280" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M544.0 280 H1000.0 L976.0 352 H520.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="760" y="326.0" font-size="30" text-anchor="middle" fill="{{ink}}">LEGGI voto</text>
<path d="M760 352 V432" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<circle cx="760" cy="392" r="6" fill="{{line}}" />
<path d="M760 432 L1080.0 520.0 L760 608 L440.0 520.0 Z" fill="#fef3c7" stroke="{{runtime}}" stroke-width="4" />
<text x="760" y="512.0" font-size="30" text-anchor="middle" fill="{{ink}}">(voto &lt; 0)</text>
<text x="760" y="548.0" font-size="30" text-anchor="middle" fill="{{ink}}">O (voto &gt; 10)?</text>
<path d="M760 608 V704" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="808" y="656" font-size="28" text-anchor="middle" fill="{{line}}">true</text>
<path d="M544.0 704 H1000.0 L976.0 776 H520.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="760" y="750.0" font-size="30" text-anchor="middle" fill="{{ink}}">LEGGI voto</text>
<path d="M760 776 V864 H240 V392 H760" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M1080 520 H1504 V704" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="1264" y="496" font-size="28" text-anchor="middle" fill="{{line}}">false</text>
<path d="M1308.0 704 H1724.0 L1700.0 776 H1284.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
<text x="1504" y="750.0" font-size="30" text-anchor="middle" fill="{{ink}}">MOSTRA voto</text>
<path d="M1504 776 V888" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<rect x="1384.0" y="888" width="240" height="64" rx="32.0" fill="#dbeafe" stroke="{{process}}" stroke-width="4" />
<text x="1504" y="930.0" font-size="30" text-anchor="middle" fill="{{ink}}">FINE</text>
  </g>
</svg>
