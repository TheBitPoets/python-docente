<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m00-input-output.svg">
<title id="title">Input, trasformazione, output e vincoli</title>
<desc id="desc">Il prezzo e il pagamento entrano nella trasformazione del resto; il pagamento sufficiente è un vincolo, mentre il risultato è il resto.</desc>
<defs id="visual-kit-components"/><defs><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="6" orient="auto"><path d="M0 0L13 6L0 12z" fill="{{line}}"/></marker></defs>
<rect width="1920" height="1080" fill="{{canvas}}"/><g font-family="{{family}}"><text x="64" y="100" font-size="48" fill="{{surface}}">Che cosa entra e che cosa esce?</text><text x="64" y="150" font-size="28" fill="{{muted}}">Esempio: una bottiglia costa 2 euro e il cliente paga 5 euro.</text>
<rect x="64" y="250" width="470" height="500" rx="24" fill="{{panel}}"/><rect x="725" y="250" width="470" height="500" rx="24" fill="{{panel}}"/><rect x="1386" y="250" width="470" height="500" rx="24" fill="{{panel}}"/>
<use href="#tpsi-value" x="205" y="330" width="190" height="142"/><text x="120" y="560" font-size="38" fill="{{surface}}">INPUT</text><text x="120" y="615" font-size="28" fill="{{muted}}">prezzo = 2</text><text x="120" y="660" font-size="28" fill="{{muted}}">pagamento = 5</text>
<use href="#tpsi-function" x="865" y="340" width="190" height="142"/><text x="785" y="560" font-size="38" fill="{{surface}}">TRASFORMAZIONE</text><text x="785" y="615" font-size="28" fill="{{muted}}">pagamento − prezzo</text><use href="#tpsi-decision" x="885" y="650" width="150" height="112"/>
<use href="#tpsi-value" x="1525" y="330" width="190" height="142"/><text x="1440" y="560" font-size="38" fill="{{surface}}">OUTPUT</text><text x="1440" y="615" font-size="28" fill="{{muted}}">resto = 3 euro</text><text x="1440" y="695" font-size="28" fill="{{runtime}}">VINCOLO</text><text x="1440" y="735" font-size="25" fill="{{muted}}">pagamento ≥ prezzo</text>
<g fill="none" stroke="{{line}}" stroke-width="8" marker-end="url(#arrow)"><path d="M534 500H710"/><path d="M1194 500h176"/></g><text x="64" y="900" font-size="30" fill="{{surface}}">Un dato appartiene all'input solo se serve a calcolare o controllare il risultato.</text></g></svg>
