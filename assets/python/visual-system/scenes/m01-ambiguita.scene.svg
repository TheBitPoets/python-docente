<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m01-ambiguita.svg">
<title id="title">Da istruzione ambigua a decisione esplicita</title><desc id="desc">Il confronto fra una procedura vaga e una procedura esplicita mostra come le condizioni definiscano tutti i risultati possibili.</desc><defs id="visual-kit-components"/><rect width="1920" height="1080" fill="{{canvas}}"/><g font-family="{{family}}"><text x="64" y="100" font-size="48" fill="{{surface}}">Dire l'intenzione non basta</text><text x="64" y="150" font-size="28" fill="{{muted}}">Un algoritmo deve indicare quale decisione prendere in ogni caso.</text><rect x="64" y="245" width="760" height="555" rx="24" fill="{{panel}}"/><use href="#tpsi-error" x="150" y="320" width="150" height="112"/><text x="130" y="510" font-size="34" fill="{{surface}}">DESCRIZIONE VAGA</text><text x="130" y="575" font-size="29" fill="{{muted}}">Prendi due numeri.</text><text x="130" y="630" font-size="29" fill="{{muted}}">Scegli quello giusto.</text><text x="130" y="685" font-size="29" fill="{{runtime}}">Manca la regola.</text><rect x="930" y="245" width="926" height="555" rx="24" fill="{{panel}}"/><use href="#tpsi-decision" x="1020" y="320" width="150" height="112"/><text x="1000" y="510" font-size="34" fill="{{surface}}">DECISIONE ESPLICITA</text><text x="1000" y="575" font-size="29" fill="{{muted}}">Se A &gt; B, restituisci A.</text><text x="1000" y="630" font-size="29" fill="{{muted}}">Se B &gt; A, restituisci B.</text><text x="1000" y="685" font-size="29" fill="{{muted}}">Altrimenti, dichiara “uguali”.</text><path d="M840 520H910" stroke="{{line}}" stroke-width="8"/><text x="64" y="930" font-size="30" fill="{{surface}}">La chiarezza nasce dalla copertura dei casi, non dalla brevità della frase.</text></g></svg>
