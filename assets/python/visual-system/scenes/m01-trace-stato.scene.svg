<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" data-output="../../m01-trace-stato.svg">
<title id="title">Trace manuale e cambiamento dello stato</title><desc id="desc">Un prezzo di 120 attraversa assegnazione, decisione e calcolo fino all'output finale di 110.</desc><defs id="visual-kit-components"/><rect width="1920" height="1080" fill="{{canvas}}"/><g font-family="{{family}}"><text x="64" y="100" font-size="48" fill="{{surface}}">Il trace segue lo stato passo dopo passo</text><text x="64" y="150" font-size="28" fill="{{muted}}">A ogni riga chiediamo che cosa rappresentano i valori in quel momento.</text><g fill="{{panel}}"><rect x="64" y="250" width="420" height="460" rx="24"/><rect x="550" y="250" width="420" height="460" rx="24"/><rect x="1036" y="250" width="420" height="460" rx="24"/><rect x="1522" y="250" width="334" height="460" rx="24"/></g><g fill="{{surface}}" font-size="31" text-anchor="middle"><text x="274" y="345">INPUT</text><text x="760" y="345">STATO</text><text x="1246" y="345">DECISIONE</text><text x="1689" y="345">OUTPUT</text></g><g fill="{{muted}}" font-size="28" text-anchor="middle"><text x="274" y="460">prezzo = 120</text><text x="760" y="460">sconto = 0</text><text x="760" y="515">finale non ancora</text><text x="760" y="555">calcolato</text><text x="1246" y="460">120 &gt; 100</text><text x="1246" y="515">sconto = 10</text><text x="1689" y="460">finale = 110</text></g><g fill="none" stroke="{{line}}" stroke-width="8"><path d="M490 500H535"/><path d="M976 500H1021"/><path d="M1462 500H1507"/></g><text x="64" y="880" font-size="30" fill="{{surface}}">Il valore cambia solo quando un passo lo assegna o lo aggiorna.</text></g></svg>
