<rect x="1072.0" y="848" width="704" height="64" rx="0" fill="#ede9fe" stroke="{{testing}}" stroke-width="4" />
<text x="1424" y="890.0" text-anchor="middle" font-size="30" fill="{{ink}}">31: sopra soglia</text>
  </g>
</svg>
