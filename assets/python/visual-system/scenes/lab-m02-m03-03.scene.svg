<path d="M880 760 H1132" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="992" y="736" font-size="28" text-anchor="middle" fill="{{line}}">true</text>
<path d="M1144.0 728 H1600.0 L1576.0 792 H1120.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
