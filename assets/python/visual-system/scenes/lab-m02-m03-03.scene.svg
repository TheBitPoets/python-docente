<path d="M1588 760 H1776" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<path d="M640 816 V856" fill="none" stroke="{{line}}" stroke-width="4" stroke-linejoin="round" marker-end="url(#flow-arrow)" />
<text x="688" y="848" font-size="28" text-anchor="middle" fill="{{line}}">false</text>
<path d="M384.0 856 H920.0 L896.0 920 H360.0 Z" fill="#ccfbf1" stroke="{{thread}}" stroke-width="4" />
